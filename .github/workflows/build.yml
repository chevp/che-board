name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            flag: --mac
          - os: windows-latest
            name: windows
            flag: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and electron
        run: npm run build

      - name: Package (${{ matrix.name }})
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            npx electron-builder ${{ matrix.flag }} --publish always
          else
            npx electron-builder ${{ matrix.flag }} --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code-signing on CI (no certificates configured).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload CI artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: che-board-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
          if-no-files-found: warn
          retention-days: 14
